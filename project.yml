name: SolWhisper
options:
  bundleIdPrefix: cloud.solay
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    # Sprint 0: leave blank until Apple Developer cert is available locally.
    # Once the Developer ID Application cert is in Keychain, set this to the
    # 10-char Team ID and switch CODE_SIGN_IDENTITY to "Developer ID Application".
    # `scripts/release.sh` also accepts SW_TEAM_ID env var as an override.
    DEVELOPMENT_TEAM: ""
    PRODUCT_BUNDLE_IDENTIFIER: cloud.solay.SolWhisper
    ENABLE_HARDENED_RUNTIME: YES
    OTHER_SWIFT_FLAGS: ""

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    majorVersion: 2.6.0
  WhisperKit:
    url: https://github.com/argmaxinc/argmax-oss-swift
    from: 1.0.0
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    from: 0.14.4
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.4.1

targets:
  SolWhisper:
    type: application
    platform: macOS
    # xcodegen 2.45.3 silently drops the dedicated `resources:` field. We rely
    # on auto-classification by file extension under `sources:` instead. The
    # excludes list keeps non-bundle files (Info.plist, entitlements, dotfiles,
    # the example secrets stub, design docs) out of the app bundle.
    sources:
      - path: Sources
        excludes:
          - "**/*.md"
      - path: Resources
        excludes:
          - "Info.plist"
          - "SolWhisper.entitlements"
          - "local-secrets.example.json"
          - ".DS_Store"
          - "SkillPacks"
      # SkillPacks + Skills both ship as folder references (blue folders) so
      # the nested directory structure is preserved at runtime. Without this,
      # xcodegen flattens everything to the bundle root, and the loader's
      # `Bundle.main.urls(... subdirectory: "Skills" / "SkillPacks/…")`
      # returns nothing because the subdir doesn't exist in the bundle.
      - path: Resources/SkillPacks
        type: folder
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_NAME: SolWhisper
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: Resources/SolWhisper.entitlements
      properties:
        com.apple.security.device.audio-input: true
        com.apple.security.automation.apple-events: true
        com.apple.security.network.client: true
    dependencies:
      - package: Sparkle
      - package: WhisperKit
        product: WhisperKit
      - package: FluidAudio
        product: FluidAudio
      - package: MarkdownUI
        product: MarkdownUI
      - target: solwhisper-mcp
    preBuildScripts:
      - name: Bump Build Number
        script: |
          # CFBundleVersion = minutes since the Unix epoch. Monotonic by
          # wall-clock time and independent of accumulated local build count,
          # so a release build can never fall behind a dev/test machine. The
          # old CURRENT+1 scheme let local dev builds outrun the released
          # build number, which made Sparkle report "you're up to date" even
          # when a newer release existed. The committed value no longer
          # matters — every build stamps "now" (~29.6M today, safely under
          # the 2^31 version-component ceiling for millennia).
          PLIST="${PROJECT_DIR}/Resources/Info.plist"
          NEXT=$(( $(date +%s) / 60 ))
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEXT" "$PLIST"
          echo "Build number (epoch-min): $NEXT"
        shell: /bin/bash
    postBuildScripts:
      - name: Copy MCP binary into bundle
        script: |
          # Copy the built solwhisper-mcp binary into SolWhisper.app/Contents/MacOS
          # so users can point Claude Desktop / Cursor at a stable absolute path.
          SRC="${BUILT_PRODUCTS_DIR}/solwhisper-mcp"
          DEST="${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/MacOS/solwhisper-mcp"
          if [ -f "$SRC" ]; then
            cp "$SRC" "$DEST"
            chmod +x "$DEST"
            echo "Bundled solwhisper-mcp at $DEST"
          else
            echo "warning: solwhisper-mcp binary not found at $SRC"
          fi
        shell: /bin/bash

  SolWhisperTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SolWhisperTests
    dependencies:
      - target: SolWhisper
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SolWhisper.app/Contents/MacOS/SolWhisper"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: cloud.solay.SolWhisperTests

  # MCP server CLI binary. Spawned by Claude Desktop / Cursor over stdio.
  # Bundled inside SolWhisper.app/Contents/MacOS/ so users can point their
  # MCP client at a stable path without separate install steps.
  solwhisper-mcp:
    type: tool
    platform: macOS
    sources:
      - path: MCP
    settings:
      base:
        PRODUCT_NAME: solwhisper-mcp
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
